name: Phoenix test automation project

on:
  push:
    branches: ["master"]

  pull_request:
    branches: ["master"]

  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa, uat, dev]
        default: qa
        required: true

      suiteXmlFile:
        description: "Test ng xml file"
        type: choice
        options: [testng.xml, smoke.xml, regression.xml]
        default: testng.xml
        required: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

          -name: Creating the .env file
          run: |
            echo "DB_URL:${{ secrets.DB_URL }}" >> .env
            echo "DB_UN:${{ secrets.DB_UN }}" >> .env
            echo "DB_PWD:${{ secrets.DB_PWD }}" >> .env

      - name: Default values for Execution
        id: default
        run: |
          echo "suiteXmlFile=${{ github.event.inputs.suiteXmlFile || 'testng.xml' }}" >> $GITHUB_OUTPUT
          echo "env=${{ github.event.inputs.env || 'qa' }}" >> $GITHUB_OUTPUT

      - name: Execute test automation framework
        run: |
          mvn clean test \
          -DsuiteXmlFile="${{ steps.default.outputs.suiteXmlFile }}" \
          -Denv="${{ steps.default.outputs.env }}"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: surefire-report
          path: target/surefire-reports
          retention-days: 10
